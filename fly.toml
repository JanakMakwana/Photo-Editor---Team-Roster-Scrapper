# fly.toml app configuration file generated for VeloRoster AI
app = "veloroster-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  REMBG_MODEL = "u2netp"

# Mount persistent volume if created with 'fly volumes create data_vol -s 1'
# [mounts]
#   source = "data_vol"
#   destination = "/data"
