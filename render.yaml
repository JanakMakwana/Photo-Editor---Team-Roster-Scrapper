services:
  - type: web
    name: veloroster-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python studio.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REMBG_MODEL
        value: u2netp
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL
        value: "600"
      - key: KEEP_ALIVE_URL
        value: "https://veloroster-ai.onrender.com/healthz"
